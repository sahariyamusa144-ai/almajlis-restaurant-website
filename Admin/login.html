<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almajlis - Admin Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f1ea;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.login-box{width:100%;max-width:420px;background:#fff;padding:40px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
h1{text-align:center;color:#222;margin-bottom:10px}.subtitle{text-align:center;color:#777;margin-bottom:30px}.form-group{margin-bottom:20px}
label{display:block;margin-bottom:8px;font-weight:bold;color:#333}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:15px;outline:none}
input:focus{border-color:#b8860b}
button{width:100%;padding:14px;border:none;border-radius:8px;background:#b8860b;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{background:#966f08}#message{text-align:center;margin-top:20px;font-weight:bold}
</style>
</head>
<body>
<div class="login-box">
<h1>Almajlis</h1><p class="subtitle">Moderator Login</p>
<form id="loginForm">
<div class="form-group"><label for="username">Username</label><input type="text" id="username" placeholder="Enter username" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Enter password" required></div>
<button type="submit">Login</button>
</form>
<p id="message"></p>
</div>
<script>
const loginForm=document.getElementById("loginForm"),message=document.getElementById("message");
loginForm.addEventListener("submit",async function(event){
event.preventDefault();
const username=document.getElementById("username").value.trim(),password=document.getElementById("password").value;
try{
const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({username,password})});
const data=await response.json();
if(!response.ok){message.textContent=data.message||"Login failed.";message.style.color="red";return;}
message.textContent="Login successful!";message.style.color="green";
setTimeout(()=>{window.location.href="dashboard.html"},500);
}catch(error){console.error(error);message.textContent="Server connection failed. Please try again.";message.style.color="red";}
});
</script>
</body>
</html>
